name: Render Remotion video

# Fill in the form under Actions → "Render Remotion video" → Run workflow.
on:
  workflow_dispatch:
    inputs:
      titleText:
        description: Title
        required: true
        default: Made with Remotion
      subtitleText:
        description: Subtitle
        required: true
        default: Rendered by GitHub Actions
      accentColor:
        description: Accent color (CSS)
        required: true
        default: "#7c5cff"
      backgroundColor:
        description: Background color (CSS)
        required: true
        default: "#0b0b12"

permissions:
  contents: read

jobs:
  render:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    defaults:
      run:
        working-directory: remotion
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: remotion/package-lock.json
      - run: npm ci
      - name: Write input props
        env:
          INPUTS: ${{ toJSON(inputs) }}
        run: echo "$INPUTS" > input-props.json
      - name: Render
        run: npx remotion render TitleCard out/video.mp4 --props=input-props.json
      - uses: actions/upload-artifact@v4
        with:
          name: remotion-video
          path: remotion/out/video.mp4
